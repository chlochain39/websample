<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Indie Kid - Contact</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="contact-page">
    <div class="website">
      <!-- HEADER -->
      <header>
        <div class="logo">✦ indie kid ☆</div>

        <p class="tagline">same sky, different dreams.</p>

        <!-- NAVIGATION -->
        <nav>
          <a href="index.html">HOME</a>
          <a href="about.html">ABOUT</a>
          <a href="contact.html">CONTACT</a>
        </nav>
      </header>

      <!-- CONTACT CONTENT -->
      <main>
        <div class="window">
          <div class="window-title">☆ CONTACT ME</div>

          <p>Want to say hello?</p>

          <p>I'd love to hear from you!</p>

          <p>📧 Email: vinenyxvii@gmail.com</p>

          <p>📷 Instagram: @7thveye</p>

          <p>🖊️ tumblr: kneop6th</p>
        </div>

        <div class="window">
          <div class="window-title">✦ Send a Message</div>

          <form action="https://formspree.io/f/xvkgqanq" method="POST">
            <label>Name:</label>
            <input type="text" name="name" required />

            <label>Email:</label>
            <input type="email" name="email" required />

            <label>Message:</label>
            <textarea name="message" required></textarea>

            <button type="submit">SEND ♡</button>
          </form>
        </div>
      </main>

      <footer>✦ made with kenopsia ♡ ✦</footer>
    </div>
